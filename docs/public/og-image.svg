<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.25)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0)"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- 装飾波形 -->
  <path d="M 0 540 Q 300 480 600 540 T 1200 540 L 1200 630 L 0 630 Z" fill="rgba(56, 189, 248, 0.05)"/>
  <path d="M 0 570 Q 300 520 600 570 T 1200 570" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="2"/>

  <!-- 原子・物理アイコン装飾 (右側) -->
  <g transform="translate(860, 300)">
    <circle cx="0" cy="0" r="140" fill="none" stroke="rgba(56, 189, 248, 0.15)" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="130" ry="45" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.6" transform="rotate(30)"/>
    <ellipse cx="0" cy="0" rx="130" ry="45" fill="none" stroke="#818cf8" stroke-width="3" opacity="0.6" transform="rotate(-30)"/>
    <ellipse cx="0" cy="0" rx="130" ry="45" fill="none" stroke="#c084fc" stroke-width="3" opacity="0.6" transform="rotate(90)"/>
    
    <circle cx="0" cy="0" r="30" fill="#f43f5e" filter="drop-shadow(0 0 15px rgba(244, 63, 94, 0.6))"/>
    <circle cx="95" cy="55" r="9" fill="#38bdf8" filter="drop-shadow(0 0 10px #38bdf8)"/>
    <circle cx="-95" cy="-55" r="9" fill="#818cf8" filter="drop-shadow(0 0 10px #818cf8)"/>
  </g>

  <!-- 左側テキストコンテンツ -->
  <g transform="translate(90, 160)">
    <!-- バッジ -->
    <rect x="0" y="0" width="360" height="38" rx="19" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="180" y="24" fill="#38bdf8" font-size="16" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="bold" text-anchor="middle">
      ⚡ 高校物理・共通テスト・国公立大学受験
    </text>

    <!-- メインタイトル -->
    <text x="0" y="95" fill="url(#accent-grad)" font-size="56" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" letter-spacing="-1">
      高校物理シミュレーションラボ
    </text>

    <!-- キャッチコピー -->
    <text x="0" y="155" fill="#f8fafc" font-size="28" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700">
      動くシミュレーションと厳選例題で直感的に完全攻略！
    </text>

    <!-- 説明文 -->
    <text x="0" y="205" fill="#94a3b8" font-size="19" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="500">
      力学・波動・電磁気・熱力学・原子物理 全67テーマ完全網羅
    </text>
    <text x="0" y="235" fill="#94a3b8" font-size="19" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="500">
      公式の完全導出 ✕ Retina対応ベクターSVG図解 ✕ 演習問題集完備
    </text>

    <!-- タグバッジ群 -->
    <g transform="translate(0, 275)">
      <rect x="0" y="0" width="105" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="52" y="22" fill="#e2e8f0" font-size="14" font-weight="600" text-anchor="middle">🏎️ 力学</text>

      <rect x="115" y="0" width="105" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="167" y="22" fill="#e2e8f0" font-size="14" font-weight="600" text-anchor="middle">🌊 波動</text>

      <rect x="230" y="0" width="105" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="282" y="22" fill="#e2e8f0" font-size="14" font-weight="600" text-anchor="middle">⚡ 電磁気</text>

      <rect x="345" y="0" width="105" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="397" y="22" fill="#e2e8f0" font-size="14" font-weight="600" text-anchor="middle">🔥 熱力学</text>

      <rect x="460" y="0" width="105" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="512" y="22" fill="#e2e8f0" font-size="14" font-weight="600" text-anchor="middle">⚛️ 原子</text>
    </g>
  </g>
</svg>
